<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/settings.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches the title in tauri.conf.json, so the two can't disagree about
         what the window is called. -->
    <title>tonemate 设置</title>
    <script type="module" src="/src/settings.ts" defer></script>
  </head>

  <body>
    <main>
      <h1>设置</h1>

      <!-- The tabs are a radio group so ← → move between them and the panel
           switch needs no JavaScript: the inputs precede both the tab bar and
           the panels, so `:checked ~` can reach them. Provider settings are
           kept off the colour panel deliberately — there will be more services
           than colours before long. -->
      <div class="tabbed">
        <input type="radio" name="tab" id="tab-appearance" checked />
        <input type="radio" name="tab" id="tab-service" />

        <div class="tabbar">
          <label for="tab-appearance">外观</label>
          <label for="tab-service">翻译服务</label>
        </div>

        <section class="panel" id="panel-appearance">
          <!-- A radio group, so ← → move between the colours and the choice
               reads as one setting with six values rather than six switches.
               The swatch is drawn by the label: the input itself is taken off
               screen rather than hidden, because `display: none` would also
               take it out of the tab order. -->
          <fieldset id="accent">
            <legend>输入条颜色</legend>
            <!-- The swatches are laid out in a wrapper rather than on the
                 fieldset itself: a legend is not an ordinary child, and engines
                 disagree about what it does inside a grid. -->
            <div class="swatches">
              <label>
                <input type="radio" name="accent" value="graphite" />
                <span class="swatch" data-accent="graphite"></span>
                石墨
              </label>
              <label>
                <input type="radio" name="accent" value="indigo" />
                <span class="swatch" data-accent="indigo"></span>
                靛蓝
              </label>
              <label>
                <input type="radio" name="accent" value="pine" />
                <span class="swatch" data-accent="pine"></span>
                墨绿
              </label>
              <label>
                <input type="radio" name="accent" value="wine" />
                <span class="swatch" data-accent="wine"></span>
                酒红
              </label>
              <label>
                <input type="radio" name="accent" value="violet" />
                <span class="swatch" data-accent="violet"></span>
                紫罗兰
              </label>
              <label>
                <input type="radio" name="accent" value="amber" />
                <span class="swatch" data-accent="amber"></span>
                琥珀
              </label>
            </div>
          </fieldset>
        </section>

        <section class="panel" id="panel-service">
          <fieldset id="provider">
            <legend>翻译服务</legend>
            <div class="providers">
              <label>
                <input type="radio" name="provider" value="deepseek" />
                <span class="name">DeepSeek</span>
                <span class="note" id="deepseek-state"></span>
              </label>
              <label>
                <input type="radio" name="provider" value="qwen" />
                <span class="name">Qwen</span>
                <!-- Filled in from `qwen_key_set`; the key itself never reaches
                     this window. -->
                <span class="note" id="qwen-state"></span>
              </label>
              <label>
                <input type="radio" name="provider" value="kimi" />
                <span class="name">Kimi</span>
                <!-- Filled in from `kimi_key_set`; the key itself never reaches
                     this window. -->
                <span class="note" id="kimi-state"></span>
              </label>
              <label>
                <input type="radio" name="provider" value="bedrock" />
                <span class="name">AWS Bedrock</span>
                <!-- Filled in from `aws_profile`; the profile name is not a
                     secret, so it may show in full here. -->
                <span class="note" id="bedrock-state"></span>
              </label>
              <label>
                <input type="radio" name="provider" value="local" />
                <span class="name">本地模型 (Hy-MT2)</span>
                <span class="note" id="local-state"></span>
              </label>
            </div>
          </fieldset>

          <div class="key" data-provider="deepseek">
            <label for="deepseek-key">DeepSeek API Key</label>
            <div class="key-row">
              <input
                type="password"
                id="deepseek-key"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" id="deepseek-clear">清除</button>
            </div>
            <p class="hint" id="deepseek-hint"></p>
          </div>

          <div class="key" data-provider="qwen">
            <label for="qwen-key">Qwen API Key</label>
            <div class="key-row">
              <input
                type="password"
                id="qwen-key"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" id="qwen-clear">清除</button>
            </div>
            <p class="hint" id="qwen-hint"></p>
          </div>

          <div class="key" data-provider="kimi">
            <label for="kimi-key">Kimi API Key</label>
            <div class="key-row">
              <input
                type="password"
                id="kimi-key"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" id="kimi-clear">清除</button>
            </div>
            <p class="hint" id="kimi-hint"></p>
          </div>

          <div class="key" data-provider="bedrock">
            <label for="aws-profile">AWS Profile</label>
            <div class="key-row">
              <input
                type="text"
                id="aws-profile"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <p class="hint" id="aws-hint"></p>
          </div>

          <div class="key" data-provider="local">
            <label for="local-progress">模型下载</label>
            <div class="progress" id="local-progress">
              <div class="bar" id="local-bar"></div>
            </div>
            <p class="hint" id="local-hint"></p>
          </div>

          <p id="active"></p>
        </section>
      </div>
    </main>
  </body>
</html>
