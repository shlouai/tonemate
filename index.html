<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tonemate</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="bar">
      <div class="row">
        <!-- Pointer-only handle for moving the window, so it stays out of the
             accessibility tree: there is no keyboard way to move the bar, and a
             control a screen reader can announce but not operate is worse than
             none. -->
        <div id="grip" aria-hidden="true"></div>
        <input
          id="input"
          type="text"
          autofocus
          autocomplete="off"
          spellcheck="false"
          placeholder="说点什么…  (Enter 提交 / Esc 隐藏)"
        />
      </div>
      <!-- The dots carry no text, so the state they stand for is on the wrapper
           for anything that isn't looking at the screen. -->
      <div id="loading" hidden role="status" aria-label="翻译中">
        <span></span><span></span><span></span>
      </div>
      <div id="output" hidden></div>
      <!-- Floats over the empty right end of the input row rather than taking a
           slot of its own: the window is resized to fit .bar, so anything in the
           flow would make the whole bar jump every time you copy. -->
      <div id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
